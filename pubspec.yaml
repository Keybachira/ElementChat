name: element_chat
description: ElementChat v2 - Chat em grupo sem internet. Sem servidor. 100% Bluetooth.
version: 2.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bluetooth_serial: ^0.4.0
  sqflite: ^2.3.0
  path: ^1.8.3
  crypto: ^3.0.3
  encrypt: ^5.0.3
  flutter_local_notifications: ^17.2.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  archive: ^3.6.1
  permission_handler: ^11.0.0
  share_plus: ^13.1.0

dependency_overrides:
  flutter_bluetooth_serial:
    path: vendor/flutter_bluetooth_serial

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
